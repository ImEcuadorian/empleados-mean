<form #loginForm="ngForm" (ngSubmit)="submit()">
  <label for="email">Correo electrónico</label>
  <input id="email" name="email" type="email" [(ngModel)]="email"
    required email maxlength="254" autocomplete="username" [disabled]="loading">
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" [(ngModel)]="password"
    required autocomplete="current-password" [disabled]="loading">
  <button type="submit" [disabled]="loginForm.invalid || loading">
    {{ loading ? 'Ingresando…' : 'Ingresar' }}
  </button>
</form>
