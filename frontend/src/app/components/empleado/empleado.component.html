<div class="row">

  <div class="col-md-4">

    <app-empleado-form
      (crear)="crearEmpleado($event)"
    />

  </div>


  <div class="col-md-8">

    <ng-container
      *ngIf="empleados$ | async as empleados"
    >

      <app-empleado-list
        [empleados]="empleados"
        (eliminar)="eliminarEmpleado($event)"
      />

    </ng-container>

  </div>

</div>
