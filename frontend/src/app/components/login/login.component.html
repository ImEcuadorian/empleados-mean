<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <p class="eyebrow">GESTIÓN DE EMPLEADOS</p>
    <h1 id="login-title">Iniciar sesión</h1>
    <p>Ingresa con tu cuenta para administrar los empleados.</p>
    <p *ngIf="error" role="alert" class="error">{{ error }}</p>
    <app-login-form [loading]="loading" (submitLogin)="iniciarSesion($event)"></app-login-form>
    <small>La sesión dura 15 minutos. Al recargar verificamos su validez con el servidor.</small>
  </section>
</main>
