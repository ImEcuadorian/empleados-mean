<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <p class="eyebrow">GESTIÓN DE EMPLEADOS</p>
    <h1 id="login-title">Iniciar sesión</h1>
    <p>Ingresa con tu cuenta para administrar los empleados.</p>
    <form #loginForm="ngForm" (ngSubmit)="iniciarSesion()">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" [(ngModel)]="email"
        required email maxlength="254" autocomplete="username" [disabled]="loading">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password"
        required autocomplete="current-password" [disabled]="loading">
      <p *ngIf="error" role="alert" class="error">{{ error }}</p>
      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
    <small>Por seguridad, al recargar la página deberás volver a iniciar sesión.</small>
  </section>
</main>
